<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Web</title>
    <!-- Si tenés un archivo CSS propio en static, lo cargás así: -->
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        header {
            margin-bottom: 40px;
        }
        .music-player-container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: inline-block;
            margin-top: 20px;
        }
        audio {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bienvenido a mi Catálogo Web</h1>
        <p>Explora nuestros productos y disfruta de nuestra música.</p>
    </header>

    <main>
        <!-- Sección del Reproductor de Música MP3 -->
        <div class="music-player-container">
            <h3>🎵 Música Destacada</h3>
            <audio controls>
                <!-- Asegurate de que el archivo se llame cancion.mp3 dentro de app/static -->
                <source src="/static/cancion.mp3" type="audio/mpeg">
                Tu navegador no soporta el elemento de audio.
            </audio>
        </div>
    </main>

    <footer>
        <p style="margin-top: 50px; font-size: 0.9em; color: #777;">&copy; 2026 Catálogo Web</p>
    </footer>

</body>
</html>
